name: External report
description: Boundary failure on synthetic data. No raw streams. No PII.
title: "[intake] "
labels: ["intake"]
body:
  - type: markdown
    attributes:
      value: |
        Status PUBLIC CANDIDATE. Do not paste identifiers, health information, or raw payloads.
  - type: input
    id: contract
    attributes:
      label: Contract or command
      placeholder: ingest / validate / publication-check / verify-chain
    validations:
      required: true
  - type: textarea
    id: synthetic
    attributes:
      label: Synthetic reproduction
      description: Fixture names and expected gate failure only.
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Source class
      options: ["H", "T", "E", "M"]
    validations:
      required: true
